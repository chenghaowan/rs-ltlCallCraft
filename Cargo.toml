[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli", "crates/gui"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
ltl-chat-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
# iroh 1.x 与 iroh-gossip 0.102 同一发布列车(0.102 依赖 iroh ^1)
iroh = "1.4"
iroh-gossip = "0.102"
# 局域网 mDNS 地址发现(同机/同网段不依赖 n0 公网 DNS)
iroh-mdns-address-lookup = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
toml = "1"
hex = "0.4"
data-encoding = "2"
bytes = "1"
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# 与 pointtofix / ai-runtime 同版本,生态一致
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
rfd = "0.17"

[profile.dev]
# dev 也开一层优化:iroh/rusqlite/image 未优化时明显卡顿
opt-level = 1

[profile.release]
strip = "symbols"
